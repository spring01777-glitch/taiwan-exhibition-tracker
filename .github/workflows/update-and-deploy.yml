name: Update exhibitions and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Taipei; GitHub scheduling may be delayed
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: exhibition-update-and-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      update_code: ${{ steps.update.outputs.code }}
      live_code: ${{ steps.live.outputs.code }}
      f1_code: ${{ steps.f1.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
        # Parser and browser controller only; use runner's existing Chrome.
        # No Playwright browser download or browser-security changes.
      - name: Install lightweight update dependencies
        run: python -m pip install -r requirements-update.txt
      - name: Verify updater
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/update.py
          node --check app.js
          node --check concerts.js
          node scripts/live_filter_regression.js
          node --check f1.js
          node tests/f1-regression.cjs
      - name: Recheck up to three previously matched official source pages
        timeout-minutes: 2
        run: python scripts/recover_source_links.py
      - name: Fetch official open data, preserving last success on failure
        id: update
        shell: bash
        run: |
          set +e
          python scripts/update_venue_sources.py
          venue_code=$?
          python scripts/update.py
          code=$?
          set -e
          if [ "$venue_code" != '0' ]; then code=1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          python scripts/validate_public.py
      - name: Refresh licensed concert and comedy metadata
        id: live
        shell: bash
        run: |
          set +e
          python scripts/update_live_events.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          python scripts/validate_live_events.py
      - name: Refresh licensed current-season F1 schedule
        id: f1
        shell: bash
        run: |
          set +e
          python scripts/update_f1.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          python scripts/validate_f1.py
      - name: Persist data and failure status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/exhibitions.json data/status.json data/source-links.json data/source-link-candidates.json data/curated.json data/venue-source-status.json data/concerts.json data/comedy.json data/f1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official event data and source status'
            git push origin HEAD:main
          fi
      - name: Stage only public website files
        run: |
          mkdir -p site/data
          cp index.html sources.html app.js style.css concerts.html comedy.html concerts.js concerts.css site/
          cp data/concerts.json data/comedy.json site/data/
          cp f1.html f1.js f1.css site/
          cp data/f1.json data/f1-platforms.json site/data/
          mkdir -p site/docs
          cp docs/CONCERTS.md site/docs/
          cp data/exhibitions.json site/data/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy retained or refreshed public data
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report data update failure after deploying the visible status
        if: needs.update.outputs.update_code != '0' || needs.update.outputs.live_code != '0' || needs.update.outputs.f1_code != '0'
        run: |
          echo 'Official source update failed. Last successful data and failure status were deployed.'
          exit 1
